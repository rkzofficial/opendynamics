services:
  # ===========================================
  # Convex Backend (Self-Hosted)
  # ===========================================
  convex-backend:
    image: ghcr.io/get-convex/convex-backend:latest
    container_name: opendynamics-convex-backend
    restart: unless-stopped
    ports:
      - "3210:3210"
      - "3211:3211"
    environment:
      CONVEX_SITE_URL: "${CONVEX_SELF_HOSTED_URL}"
      CONVEX_ALLOWED_ORIGINS: "https://${APP_DOMAIN},http://localhost:3000"
    volumes:
      - convex_data:/convex/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/version"]
      interval: 5s
      timeout: 5s
      retries: 5
    stop_grace_period: 10s
    stop_signal: SIGINT

  # ===========================================
  # Convex Dashboard
  # ===========================================
  convex-dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    container_name: opendynamics-convex-dashboard
    restart: unless-stopped
    ports:
      - "6791:6791"
    environment:
      CONVEX_BACKEND_DEPLOYMENT_URL: "http://convex-backend:3210"
      CONVEX_DASHBOARD_LOAD_MONACO_FROM_CDN: "false"
    depends_on:
      convex-backend:
        condition: service_healthy
    stop_grace_period: 10s
    stop_signal: SIGINT

  # ===========================================
  # OpenDynamics App
  # ===========================================
  opendynamics:
    image: aithen.ved.yt/rkzofficial/opendynamics:latest
    container_name: opendynamics-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Server binding (required for Docker)
      HOST: "0.0.0.0"
      NITRO_HOST: "0.0.0.0"
      NITRO_PORT: "3000"

      # Convex connection (points to self-hosted instance)
      NUXT_PUBLIC_CONVEX_URL: "${CONVEX_SELF_HOSTED_URL}"

      # Security keys (required)
      SESSION_SECRET: "${SESSION_SECRET}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"

      # Optional: PWA Push Notifications
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"

      # Node environment
      NODE_ENV: "production"
    depends_on:
      - convex-backend

volumes:
  convex_data:
    driver: local

networks:
  default:
    name: nginxproxymanager_default
    external: true
